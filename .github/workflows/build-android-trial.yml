# Build the KaraokeGen Android trial APK (signed release build).
# Manual trigger only — it does not run on push.
# The APK is signed with the release keystore from GitHub Actions secrets
# (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD
# / ANDROID_KEY_ALIAS) so in-app updates install over the existing app.
# See android/README.md for the keystore setup.
name: Build Android trial APK

# Needed to create the pre-release and upload the APK asset.
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — see android/README.md"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/keystore.jks"
          test -s "$GITHUB_WORKSPACE/android/keystore.jks"

      - name: Build signed release APK
        working-directory: android
        run: >
          ./gradlew assembleRelease --stacktrace
          "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/keystore.jks"
          "-Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          "-Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }}"
          "-Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Rename APK with version
        run: |
          VN=$(grep -m1 'versionName' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(grep -m1 'versionCode' android/app/build.gradle.kts | grep -o '[0-9]*')
          echo "versionName=$VN versionCode=$VC"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mv "$APK" "android/app/build/outputs/apk/release/karaokegen-$VN-vc$VC.apk"
          ls -la android/app/build/outputs/apk/release/

      - name: Verify APK signature and version
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          ls -la "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -5

      - name: Create pre-release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          if gh release view v0.1.0-trial >/dev/null 2>&1; then
            gh release upload v0.1.0-trial "$APK" --clobber
          else
            gh release create v0.1.0-trial "$APK" \
              --title "KaraokeGen Android trial v0.1.0" \
              --notes "First Android trial: paste a YouTube link, download the audio, draft via your Modal backend. Install once — updates arrive in-app (OTA)." \
              --prerelease
          fi

      # Keep release storage tidy: each build adds one ~6.5MB APK, so delete
      # all but the newest 3. The in-app updater only ever needs the latest.
      - name: Prune old APK assets (keep newest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.1.0-trial --json assets -q '.assets[] | select(.name | test("\\.apk$")) | .name' \
            | sort -t c -k2 -n | head -n -3 \
            | while read -r OLD; do
                echo "Deleting old APK: $OLD"
                gh release delete-asset v0.1.0-trial "$OLD" -y
              done
          echo "Remaining APKs:"
          gh release view v0.1.0-trial --json assets -q '.assets[] | select(.name | test("\\.apk$")) | .name'
