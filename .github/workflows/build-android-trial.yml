# Build the KaraokeGen Android trial APK (signed release build).
# Manual trigger only — it does not run on push.
# The APK is signed with the release keystore from GitHub Actions secrets
# (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD
# / ANDROID_KEY_ALIAS) so in-app updates install over the existing app.
# See android/README.md for the keystore setup.
name: Build Android trial APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — see android/README.md"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/keystore.jks"
          test -s "$GITHUB_WORKSPACE/android/keystore.jks"

      - name: Build signed release APK
        working-directory: android
        run: >
          ./gradlew assembleRelease --stacktrace
          "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/keystore.jks"
          "-Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          "-Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }}"
          "-Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Verify APK signature and version
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          ls -la "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -5

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: karaokegen-trial-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
