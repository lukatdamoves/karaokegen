# Diagnose the deployed KaraokeGen backend: list the functions in the
# karaokengen app and show whether the `api` web function exists.
# Run from Actions -> Diagnose karaokegen backend -> Run workflow.
# Uses the same MODAL_TOKEN_ID / MODAL_TOKEN_SECRET repo secrets as
# the deploy workflow.

name: Diagnose karaokegen backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      - name: Install Modal CLI
        run: pip install modal==1.6.2
      - name: Inspect the karaokegen app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "=== apps ==="
          modal app list || true
          echo "=== karaokegen app ==="
          modal app describe karaokengen || true
          echo "=== functions in karaokegen ==="
          python - <<'PY'
          import modal
          try:
              app = modal.App.lookup("karaokengen", create_if_missing=False)
              print("app:", app)
              # List functions via the client API if available.
              import inspect
              print("lookup ok")
          except Exception as e:
              print("lookup failed:", type(e).__name__, e)
          PY
