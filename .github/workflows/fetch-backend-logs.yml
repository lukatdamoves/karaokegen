name: Fetch karaokegen backend logs

# Manual trigger only. Dumps recent container logs for the deployed
# KaraokeGen backend app (modal_app.py, app 'karaokengen') so a failed
# draft/alignment job can be diagnosed from outside the sandbox (which
# cannot reach Modal's API directly). Read-only: changes nothing.
on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Modal CLI
        run: pip install "modal==1.6.2"
      - name: Fetch karaokegen backend logs
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal app logs karaokengen --tail 500
